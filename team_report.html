<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynasty Team Evolution & Acquisition History</title>
<style>
  :root {
    --bg-main: #0b0f19;
    --bg-card: #151d30;
    --bg-card-hover: #1c2740;
    --border: #23314e;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.15);
    
    --badge-draft: #3b82f6;
    --badge-rookie: #10b981;
    --badge-trade: #a855f7;
    --badge-waiver: #f59e0b;
    --badge-fa: #64748b;
    
    --pos-qb: #ef4444;
    --pos-rb: #3b82f6;
    --pos-wr: #10b981;
    --pos-te: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  body { background: var(--bg-main); color: var(--text-primary); line-height: 1.5; padding: 28px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .title-area h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
  .title-area .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
  
  /* KPI Cards */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
  .kpi-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
  .kpi-val { font-size: 24px; font-weight: 800; color: var(--accent); margin-top: 4px; }

  /* Navigation Tabs */
  .nav-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .view-tabs { display: flex; background: var(--bg-card); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .tab-btn { background: transparent; border: none; color: var(--text-secondary); padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active { background: var(--accent); color: #051322; }

  /* Season Selector */
  .season-selector { display: flex; gap: 6px; flex-wrap: wrap; }
  .season-pill { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .season-pill:hover { border-color: var(--accent); color: var(--text-primary); }
  .season-pill.active { background: var(--accent); color: #051322; border-color: var(--accent); }

  /* Filter / Search */
  .search-box { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 14px; border-radius: 8px; font-size: 13px; outline: none; min-width: 220px; }
  .search-box:focus { border-color: var(--accent); }

  /* Content Cards */
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .card-title { font-size: 17px; font-weight: 700; color: var(--text-primary); }

  /* Acquisition Progress Bar */
  .acq-bar { height: 10px; border-radius: 5px; overflow: hidden; display: flex; background: #0f172a; margin: 12px 0 20px; }
  .acq-bar-seg { height: 100%; transition: width 0.3s; }
  .acq-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; margin-bottom: 16px; color: var(--text-secondary); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }

  /* Position Grids */
  .pos-section { margin-bottom: 24px; }
  .pos-header { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

  /* Player Card */
  .player-card { background: #0f1627; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; transition: transform 0.15s, border-color 0.15s; }
  .player-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .player-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .player-name { font-size: 15px; font-weight: 700; color: #fff; }
  .player-team { font-size: 12px; color: var(--text-secondary); }
  .pos-tag { padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 800; }
  .pos-tag.QB { background: var(--pos-qb); color: #fff; }
  .pos-tag.RB { background: var(--pos-rb); color: #fff; }
  .pos-tag.WR { background: var(--pos-wr); color: #fff; }
  .pos-tag.TE { background: var(--pos-te); color: #fff; }
  .starter-star { color: #fbbf24; font-size: 11px; font-weight: 600; margin-left: 4px; }

  /* Badges */
  .acq-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 4px 10px; border-radius: 6px; font-weight: 600; margin-top: 6px; border: 1px solid transparent; }
  .badge-Draft { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
  .badge-Rookie { background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
  .badge-Trade { background: rgba(168, 85, 247, 0.15); color: #c084fc; border-color: rgba(168, 85, 247, 0.3); }
  .badge-Waivers { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }
  .badge-FreeAgency { background: rgba(100, 116, 139, 0.2); color: #94a3b8; border-color: rgba(100, 116, 139, 0.3); }

  /* Turnover Evolution Columns */
  .turnover-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .turnover-col { background: #0f1627; border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .turnover-col-header { font-size: 14px; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .col-joined { color: #34d399; }
  .col-departed { color: #f87171; }
  .col-retained { color: #38bdf8; }
  .turnover-item { padding: 10px 0; border-bottom: 1px solid #1a253e; }
  .turnover-item:last-child { border-bottom: none; }
  .turnover-item-name { font-weight: 600; font-size: 14px; }
  .turnover-item-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

  /* Trade Log */
  .trade-row { background: #0f1627; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .trade-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
  .trade-boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .trade-in { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.2); padding: 10px; border-radius: 6px; font-size: 13px; }
  .trade-out { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); padding: 10px; border-radius: 6px; font-size: 13px; }
  .trade-in-title { color: #34d399; font-weight: 700; margin-bottom: 6px; }
  .trade-out-title { color: #f87171; font-weight: 700; margin-bottom: 6px; }
  ul.clean-list { list-style: none; }
  ul.clean-list li { margin-bottom: 3px; }

  /* Table styling */
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th { text-align: left; padding: 10px 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; }
  table.data-table td { padding: 10px 12px; border-bottom: 1px solid #1c2740; }
  table.data-table tr:hover td { background: var(--bg-card-hover); }
  .tenure-pill { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(56, 189, 248, 0.15); color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="title-area">
    <h1>Farhiless Dynasty Team Evolution</h1>
    <div class="subtitle">Manager: <strong>jacques</strong> • Complete 7-Season Lifespan (2019 – 2025)</div>
  </div>
  <input type="text" id="playerSearch" class="search-box" placeholder="Search any player..." oninput="filterActiveView()">
</div>

<!-- KPI Summary -->
<div class="kpi-row">
  <div class="kpi-card">
    <div class="kpi-label">Dynasty Span</div>
    <div class="kpi-val">7 Seasons</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Total Trades</div>
    <div class="kpi-val" id="kpiTrades">64 Trades</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Draft Picks Made</div>
    <div class="kpi-val" id="kpiDrafts">56 Picks</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Total Players Cycled</div>
    <div class="kpi-val" id="kpiPlayers">246 Players</div>
  </div>
</div>

<!-- Navigation Bar -->
<div class="nav-bar">
  <div class="view-tabs">
    <button class="tab-btn active" onclick="switchView('roster', event)">Season Roster</button>
    <button class="tab-btn" onclick="switchView('turnover', event)">How Team Changed</button>
    <button class="tab-btn" onclick="switchView('lifecycle', event)">All-Time Players</button>
    <button class="tab-btn" onclick="switchView('trades', event)">Trade Ledger</button>
  </div>
  <div class="season-selector" id="seasonSelector"></div>
</div>

<!-- Main Container -->
<div id="mainView"></div>

<!-- Load Compiled Dynasty Data Externally -->
<script src="team_data.js"></script>
<script>
  const appData = window.appData || {};
  const seasons = appData.seasons || [];
  let currentSeason = "2022";
  let activeTab = "roster";

  function getBadgeClass(method) {
    if (!method) return "badge-FreeAgency";
    if (method.includes("Draft")) return "badge-Draft";
    if (method.includes("Trade")) return "badge-Trade";
    if (method.includes("Waiver")) return "badge-Waivers";
    return "badge-FreeAgency";
  }

  function init() {
    if (!appData || !appData.seasons) {
      document.getElementById("mainView").innerHTML = "<div class='card'>Error: team_data.js not loaded. Run organize_team_history.py to generate it.</div>";
      return;
    }

    const sContainer = document.getElementById("seasonSelector");
    seasons.forEach(s => {
      const btn = document.createElement("button");
      btn.className = `season-pill ${s === currentSeason ? 'active' : ''}`;
      btn.innerText = s;
      btn.id = `pill-${s}`;
      btn.onclick = () => {
        currentSeason = s;
        document.querySelectorAll(".season-pill").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        render();
      };
      sContainer.appendChild(btn);
    });
    render();
  }

  function switchView(tab, event) {
    activeTab = tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    if (event && event.target) event.target.classList.add("active");
    
    // Toggle season selector visibility
    document.getElementById("seasonSelector").style.display = (tab === 'lifecycle' || tab === 'trades') ? 'none' : 'flex';
    render();
  }

  function render() {
    const container = document.getElementById("mainView");
    container.innerHTML = "";

    if (activeTab === "roster") {
      renderRosterView(container);
    } else if (activeTab === "turnover") {
      renderTurnoverView(container);
    } else if (activeTab === "lifecycle") {
      renderLifecycleView(container);
    } else if (activeTab === "trades") {
      renderTradesView(container);
    }
  }

  function renderRosterView(container) {
    const sData = appData.seasons_data[currentSeason];
    if (!sData) return;

    const roster = sData.roster;
    const total = roster.length;
    const breakdown = sData.acq_breakdown || {};

    const card = document.createElement("div");
    card.className = "card";
    
    const draftCount = (breakdown["Draft"] || 0);
    const tradeCount = (breakdown["Trade"] || 0);
    const waiverCount = (breakdown["Waivers"] || 0);
    const faCount = (breakdown["Free Agency"] || 0);

    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">Season ${currentSeason} Roster (${total} Players)</div>
        <div style="font-size: 13px; color: var(--text-secondary);">Ordered by QB, RB, WR, TE</div>
      </div>
      <div class="acq-bar">
        <div class="acq-bar-seg" style="width: ${draftCount/total*100}%; background: var(--badge-draft);"></div>
        <div class="acq-bar-seg" style="width: ${tradeCount/total*100}%; background: var(--badge-trade);"></div>
        <div class="acq-bar-seg" style="width: ${waiverCount/total*100}%; background: var(--badge-waiver);"></div>
        <div class="acq-bar-seg" style="width: ${faCount/total*100}%; background: var(--badge-fa);"></div>
      </div>
      <div class="acq-legend">
        <span><span class="legend-dot" style="background: var(--badge-draft)"></span>Drafted: ${draftCount} (${Math.round(draftCount/total*100)}%)</span>
        <span><span class="legend-dot" style="background: var(--badge-trade)"></span>Trades: ${tradeCount} (${Math.round(tradeCount/total*100)}%)</span>
        <span><span class="legend-dot" style="background: var(--badge-waiver)"></span>Waivers: ${waiverCount} (${Math.round(waiverCount/total*100)}%)</span>
        <span><span class="legend-dot" style="background: var(--badge-fa)"></span>Free Agency: ${faCount} (${Math.round(faCount/total*100)}%)</span>
      </div>
    `;

    const posGroups = { QB: [], RB: [], WR: [], TE: [], OTHER: [] };
    roster.forEach(p => {
      if (posGroups[p.position]) posGroups[p.position].push(p);
      else posGroups.OTHER.push(p);
    });

    ["QB", "RB", "WR", "TE", "OTHER"].forEach(pos => {
      const players = posGroups[pos];
      if (!players || players.length === 0) return;

      const posDiv = document.createElement("div");
      posDiv.className = "pos-section";
      posDiv.innerHTML = `<div class="pos-header"><span class="pos-tag ${pos}">${pos}</span> ${pos} Room (${players.length})</div>`;

      const grid = document.createElement("div");
      grid.className = "player-grid";

      players.forEach(p => {
        const bClass = getBadgeClass(p.acquisition.method);
        const isStarter = p.status === "Starter";
        grid.innerHTML += `
          <div class="player-card">
            <div class="player-top">
              <div>
                <div class="player-name">
                  ${p.name}
                  ${isStarter ? '<span class="starter-star">★ Starter</span>' : ''}
                </div>
                <div class="player-team">${p.team} • Age: ${p.age}</div>
              </div>
              <span class="pos-tag ${p.position}">${p.position}</span>
            </div>
            <div class="acq-badge ${bClass}">
              ↳ ${p.acquisition.summary}
            </div>
          </div>
        `;
      });

      posDiv.appendChild(grid);
      card.appendChild(posDiv);
    });

    container.appendChild(card);
  }

  function renderTurnoverView(container) {
    const transition = appData.transitions.find(t => t.to_season === currentSeason) || appData.transitions[0];
    
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">${transition.label}</div>
        <div style="font-size: 13px; color: var(--text-secondary);">
          Turnover: +${transition.joined.length} Joined • -${transition.departed.length} Departed • ${transition.retained.length} Retained
        </div>
      </div>
      <div class="turnover-grid">
        <!-- Joined -->
        <div class="turnover-col">
          <div class="turnover-col-header col-joined">
            <span>➕ Joined the Team</span>
            <span>${transition.joined.length}</span>
          </div>
          ${transition.joined.length === 0 ? '<div style="color:var(--text-muted); font-size:13px;">No new players joined.</div>' : ''}
          ${transition.joined.map(p => `
            <div class="turnover-item">
              <div class="turnover-item-name">
                <span class="pos-tag ${p.position}">${p.position}</span> ${p.name} (${p.team})
              </div>
              <div class="turnover-item-sub">
                ↳ <strong>Acquired:</strong> ${p.acquisition.summary}
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Departed -->
        <div class="turnover-col">
          <div class="turnover-col-header col-departed">
            <span>➖ Departed the Team</span>
            <span>${transition.departed.length}</span>
          </div>
          ${transition.departed.length === 0 ? '<div style="color:var(--text-muted); font-size:13px;">No players departed.</div>' : ''}
          ${transition.departed.map(p => `
            <div class="turnover-item">
              <div class="turnover-item-name">
                <span class="pos-tag ${p.position}">${p.position}</span> ${p.name}
              </div>
              <div class="turnover-item-sub">
                ↳ <strong>Reason:</strong> ${p.departure.summary}
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Retained -->
        <div class="turnover-col">
          <div class="turnover-col-header col-retained">
            <span>🛡️ Core Retained</span>
            <span>${transition.retained.length}</span>
          </div>
          ${transition.retained.length === 0 ? '<div style="color:var(--text-muted); font-size:13px;">None</div>' : ''}
          ${transition.retained.map(p => `
            <div class="turnover-item">
              <div class="turnover-item-name">
                <span class="pos-tag ${p.position}">${p.position}</span> ${p.name}
              </div>
              <div class="turnover-item-sub">
                ↳ Original Origin: ${p.acquisition.type_label}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    container.appendChild(card);
  }

  function renderLifecycleView(container) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">All-Time Dynasty Players (${appData.all_players.length})</div>
        <div style="font-size: 13px; color: var(--text-secondary);">Sorted by longest tenure on your team</div>
      </div>
      <table class="data-table" id="lifecycleTable">
        <thead>
          <tr>
            <th>Player</th>
            <th>Pos</th>
            <th>How Acquired</th>
            <th>How Departed / Status</th>
            <th>Seasons on Team</th>
          </tr>
        </thead>
        <tbody>
          ${appData.all_players.map(p => `
            <tr>
              <td><strong>${p.name}</strong></td>
              <td><span class="pos-tag ${p.position}">${p.position}</span></td>
              <td><span class="acq-badge ${getBadgeClass(p.acquisition.method)}">${p.acquisition.summary}</span></td>
              <td>${p.is_current ? '<span style="color:#34d399; font-weight:700;">Active on Roster</span>' : p.departure.summary}</td>
              <td>
                <span class="tenure-pill">${p.seasons_count} seasons</span>
                <span style="font-size:12px; color:var(--text-muted); margin-left:6px;">(${p.seasons.join(', ')})</span>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    container.appendChild(card);
  }

  function renderTradesView(container) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">Dynasty Trade Ledger (${appData.trades.length} Total Trades)</div>
        <div style="font-size: 13px; color: var(--text-secondary);">Chronological breakdown of assets sent and received</div>
      </div>
      <div id="tradesContainer">
        ${appData.trades.map((t, idx) => `
          <div class="trade-row">
            <div class="trade-meta">
              <strong>Trade #${appData.trades.length - idx} with ${t.partner}</strong>
              <span>Season ${t.season} • ${t.date}</span>
            </div>
            <div class="trade-boxes">
              <div class="trade-in">
                <div class="trade-in-title">↓ YOU RECEIVED</div>
                <ul class="clean-list">
                  ${t.received_players.map(p => `<li>• ${p}</li>`).join('')}
                  ${t.received_picks.map(p => `<li>• ${p} Draft Pick</li>`).join('')}
                  ${t.received_players.length === 0 && t.received_picks.length === 0 ? '<li>(FAAB / Future asset)</li>' : ''}
                </ul>
              </div>
              <div class="trade-out">
                <div class="trade-out-title">↑ YOU SENT</div>
                <ul class="clean-list">
                  ${t.sent_players.map(p => `<li>• ${p}</li>`).join('')}
                  ${t.sent_picks.map(p => `<li>• ${p} Draft Pick</li>`).join('')}
                  ${t.sent_players.length === 0 && t.sent_picks.length === 0 ? '<li>(FAAB / Future asset)</li>' : ''}
                </ul>
              </div>
            </div>
          </div>
        `).reverse().join('')}
      </div>
    `;
    container.appendChild(card);
  }

  function filterActiveView() {
    const query = document.getElementById("playerSearch").value.toLowerCase();
    document.querySelectorAll(".player-card").forEach(el => {
      const text = el.innerText.toLowerCase();
      el.style.display = text.includes(query) ? "block" : "none";
    });
    document.querySelectorAll("#lifecycleTable tbody tr").forEach(el => {
      const text = el.innerText.toLowerCase();
      el.style.display = text.includes(query) ? "" : "none";
    });
  }

  init();
</script>
</body>
</html>
